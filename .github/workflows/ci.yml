name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
      - '.github/workflows/frontend-audit.yml'
      - '**/*.md'
      - 'LICENSE'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Release failure recovery
        run: python3 scripts/test-release.py

      - name: Test
        run: npm test

      - name: Build
        env:
          CATSLIBRARY_PRIVATE_SOURCES: '0'
        run: |
          npm run build
          node scripts/check-public-source-build.mjs
