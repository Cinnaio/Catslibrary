name: Deploy

# 构建放在 GitHub 托管的 runner 上，服务器只负责接收产物并重启服务：
# 生产机只有 891MB 内存，本地跑 vite build 会撞 V8 堆上限，而且 vite 会先清空
# web/dist 再打包，构建失败会直接把线上页面删空。这里改成「远端构建 → 原子替换」。
# 移除了阻塞部署的耗时全量测试，仅保留必要的类型检查与构建校验，大幅缩短发布耗时。
on:
  # 在 Actions 中选择分支并手动运行，推送与 PR 均不发布网站。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 先清空再构建：产物里绝不能混入上一次提交遗留的旧哈希资源。
      - name: Build
        run: |
          rm -rf web/dist api/dist
          npm run build

      - name: Sanity check artifacts
        run: |
          test -f web/dist/index.html
          test -f api/dist/index.js
          test -d api/dist/migrations
          node -e "
            const fs = require('fs');
            const path = require('path');
            const html = fs.readFileSync('web/dist/index.html', 'utf8');
            const refs = [...html.matchAll(/(?:src|href)=\"(\/assets\/[^\"]+)\"/g)].map((m) => m[1]);
            if (!refs.length) throw new Error('index.html 没有引用任何打包资源');
            const root = path.resolve('web/dist');
            for (const ref of refs) {
              const file = path.join(root, ref.replace(/^\//, ''));
              if (!fs.existsSync(file)) throw new Error('index.html 引用了不存在的资源: ' + ref + ' -> ' + file);
            }
            console.log('引用资源检查通过:', refs.join(', '));
          "

      - name: Package release
        run: |
          tar -czf release.tgz \
            --exclude='*.map' \
            web/dist api/dist
          ls -lh release.tgz

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.tgz
          retention-days: 14

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload release to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -o StrictHostKeyChecking=yes release.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/release-${{ github.sha }}.tgz"

      - name: Activate release and restart service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/bin/zhizhou-release '$RELEASE_SHA'"

      - name: Verify production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -eu
          systemctl is-active --quiet zhizhou.service
          base=http://127.0.0.1:8080
          health=$(curl -s -o /dev/null -w '%{http_code}' "$base/api/health")
          home=$(curl -s -o /dev/null -w '%{http_code}' "$base/")
          entry=$(curl -s "$base/" | grep -o '/assets/index-[A-Za-z0-9_.-]*\.js' | head -1 || true)
          entry_code=000
          if [ -n "${entry:-}" ]; then entry_code=$(curl -s -o /dev/null -w '%{http_code}' "$base$entry"); fi
          printf 'health=%s home=%s entry=%s(%s)\n' "$health" "$home" "${entry:-none}" "$entry_code"
          [ "$health" = 200 ] && [ "$home" = 200 ] && [ "$entry_code" = 200 ]
          REMOTE
