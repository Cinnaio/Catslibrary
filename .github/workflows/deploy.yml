name: Deploy
run-name: >-
  Deploy · ${{ inputs.build_only && '仅构建' || '生产部署' }} · ${{ inputs.core_ref }} · #${{ github.run_number }}${{ inputs.run_title && format(' · {0}', inputs.run_title) || '' }}

# Public standard runner; private sources and archives stay on this one ephemeral runner.
on:
  workflow_dispatch:
    inputs:
      run_title:
        description: '标题说明（可选，如 commit 标题或版本备注）'
        required: false
        default: ''
        type: string
      core_ref:
        description: '核心分支、标签或完整 SHA'
        required: true
        default: main
        type: string
      adapter_ref:
        description: '私有书源版本（留空保留线上版本；首次安装使用私有 main）'
        required: false
        default: ''
        type: string
      build_only:
        description: '只合并构建和验收，不切换生产版本'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build private release and deploy
    if: github.repository == 'Cinnaio/Catslibrary' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: release_smoke
          POSTGRES_PASSWORD: release_smoke
          POSTGRES_DB: release_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U release_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out trusted deployment tools
        uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - name: Check out core revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.core_ref }}
          path: core
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: core/.node-version
          # No Actions cache: build content must stay on this runner.
      - name: Check deployment and log isolation
        run: node --test tooling/.github/scripts/private-deploy.test.mjs
      - name: Pin versions and privately fetch adapters
        env:
          ADAPTER_REF: ${{ inputs.adapter_ref }}
          PRIVATE_SOURCES_REPOSITORY: ${{ vars.PRIVATE_SOURCES_REPOSITORY }}
          PRIVATE_SOURCES_SSH_KEY: ${{ secrets.PRIVATE_SOURCES_SSH_KEY }}
          PRIVATE_SOURCES_KNOWN_HOSTS: ${{ secrets.PRIVATE_SOURCES_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: node tooling/.github/scripts/private-deploy.mjs prepare
      # These processes receive neither Secrets nor Actions file-command channels.
      - name: Install isolated build dependencies
        run: node tooling/.github/scripts/private-deploy.mjs install
      - name: Verify core and private adapters
        run: node tooling/.github/scripts/private-deploy.mjs verify
      - name: Build and smoke test the final archive
        run: node tooling/.github/scripts/private-deploy.mjs build
      - name: Activate verified archive and check production
        if: ${{ !inputs.build_only }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: node tooling/.github/scripts/private-deploy.mjs publish
      - name: Remove private source, logs, keys and build output
        if: always()
        run: node tooling/.github/scripts/private-deploy.mjs cleanup
