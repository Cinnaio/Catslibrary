# 在 GitHub Actions 的 macOS runner 上构建未签名 .ipa（Windows 开发 → GitHub 云构建 → 自签安装）
#
# 签名升级（后续）：
# - 买 Apple Developer Program（$99/年）后，把 .p12 证书 + .mobileprovision 放进
#   GitHub Secrets，用 fastlane match 或 xcodebuild -exportArchive 产出签名 ipa / TestFlight

name: Build and Test iOS (unsigned IPA)
run-name: >-
  Build iOS · ${{ inputs.build_mode || 'release' }} · ${{ github.ref_name }} · #${{ github.run_number }} · ${{ inputs.run_title || github.sha }}

on:
  # 在 Actions 中选择分支并手动运行，推送与 PR 均不自动构建 IPA。
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'release：正式优化（默认）；fast：日常验收，增量编译且关闭 Swift 优化'
        required: true
        default: release
        type: choice
        options:
          - release
          - fast
      run_title:
        description: '标题说明（可选，如 commit 标题或版本备注；留空显示提交 SHA）'
        required: false
        default: ''
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: ios

concurrency:
  group: ios-build-${{ github.ref }}-${{ inputs.build_mode || 'release' }}
  cancel-in-progress: true

jobs:
  tests:
    name: Core unit tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CI cache and source timestamps
        run: python3 -B scripts/test-ci-build-cache.py

      - name: Run unit tests
        run: swift test --package-path ZhiZhouCore

  build:
    name: Build unsigned IPA (${{ inputs.build_mode || 'release' }})
    runs-on: macos-15
    env:
      IOS_BUILD_MODE: ${{ inputs.build_mode || 'release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check bundled reader rules
        run: python3 scripts/check-reader-edge-resource.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode 26 (iOS 26 SDK for Liquid Glass)
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort | tail -n 1)
          if [ -n "$XCODE_26" ]; then
            sudo xcode-select -s "$XCODE_26"
          fi
          xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Identify build cache
        id: build-cache
        run: |
          case "$IOS_BUILD_MODE" in
            release|fast) ;;
            *) echo "::error::无效构建模式"; exit 1 ;;
          esac
          TOOLCHAIN=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"
          python3 scripts/ci-build-cache.py >> "$GITHUB_OUTPUT"

      - name: Restore Release DerivedData
        id: derived-data
        uses: actions/cache/restore@v4
        with:
          path: |
            ios/DerivedData
            ios/.ci-cache/source-mtimes.json
          key: ios-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.IOS_BUILD_MODE }}-${{ steps.build-cache.outputs.toolchain }}-${{ steps.build-cache.outputs.fingerprint }}-${{ github.sha }}
          restore-keys: |
            ios-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.IOS_BUILD_MODE }}-${{ steps.build-cache.outputs.toolchain }}-${{ steps.build-cache.outputs.fingerprint }}-

      - name: Restore timestamps of unchanged build inputs
        run: python3 scripts/ci-source-mtimes.py restore

      - name: Validate property lists
        run: |
          plutil -lint ZhiZhouWidgets/Info.plist
          plutil -lint ZhiZhouWidgets/ZhiZhouWidgets.entitlements
          plutil -lint ZhiZhou/Support/ZhiZhou.entitlements
          plutil -lint ZhiZhou/Support/Info.plist
          plutil -lint ZhiZhou/Support/PrivacyInfo.xcprivacy

      - name: Build (unsigned)
        run: |
          set -o pipefail
          STARTED=$(date +%s)
          COMPILATION_MODE=wholemodule
          OPTIMIZATION_LEVEL=-O
          if [ "$IOS_BUILD_MODE" = fast ]; then
            COMPILATION_MODE=incremental
            OPTIMIZATION_LEVEL=-Onone
          fi
          xcodebuild \
            -project ZhiZhou.xcodeproj \
            -scheme ZhiZhou \
            -configuration Release \
            -derivedDataPath DerivedData \
            -destination 'generic/platform=iOS' \
            -showBuildTimingSummary \
            SWIFT_COMPILATION_MODE="$COMPILATION_MODE" \
            SWIFT_OPTIMIZATION_LEVEL="$OPTIMIZATION_LEVEL" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/ios-release-build.log"
          echo "### iOS build ($IOS_BUILD_MODE)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Swift compilation: $COMPILATION_MODE / $OPTIMIZATION_LEVEL" >> "$GITHUB_STEP_SUMMARY"
          if [ "$IOS_BUILD_MODE" = fast ]; then
            echo "- 日常验收包：关闭 Swift 优化，不用于运行性能验收或正式交付。" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Build seconds: $(($(date +%s) - STARTED))" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restored cache: ${{ steps.derived-data.outputs.cache-matched-key }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Release bundle
        env:
          EXPECTED_VERSION: ${{ steps.build-cache.outputs.marketing-version }}
          EXPECTED_BUILD: ${{ steps.build-cache.outputs.build-number }}
        run: |
          APP_PATH=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 Release .app 产物"
            exit 1
          fi
          test -f "$APP_PATH/PlugIns/ZhiZhouWidgets.appex/Info.plist"
          test -f "$APP_PATH/PlugIns/ZhiZhouWidgets.appex/ZhiZhouWidgets"
          plutil -lint "$APP_PATH/PlugIns/ZhiZhouWidgets.appex/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PATH/Info.plist")" = "$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PATH/PlugIns/ZhiZhouWidgets.appex/Info.plist")"
          test "$(plutil -extract CFBundleVersion raw -o - "$APP_PATH/Info.plist")" = "$(plutil -extract CFBundleVersion raw -o - "$APP_PATH/PlugIns/ZhiZhouWidgets.appex/Info.plist")"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PATH/Info.plist")" = "$EXPECTED_VERSION"
          test "$(plutil -extract CFBundleVersion raw -o - "$APP_PATH/Info.plist")" = "$EXPECTED_BUILD"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          plutil -lint "$APP_PATH/PrivacyInfo.xcprivacy"
          if plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoads raw -o - "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            echo "::error::Release 包仍包含 NSAllowsArbitraryLoads"
            exit 1
          fi

      - name: Package unsigned .ipa
        run: |
          APP_PATH=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 .app 产物"
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ZhiZhou-unsigned.ipa Payload
          ls -lh ZhiZhou-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IOS_BUILD_MODE == 'fast' && 'ZhiZhou-unsigned-ipa-fast' || 'ZhiZhou-unsigned-ipa' }}
          path: ios/ZhiZhou-unsigned.ipa
          if-no-files-found: error

      - name: Record build input timestamps
        if: success() && steps.derived-data.outputs.cache-hit != 'true'
        run: python3 scripts/ci-source-mtimes.py save

      - name: Save Release DerivedData
        if: success() && steps.derived-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ios/DerivedData
            ios/.ci-cache/source-mtimes.json
          key: ${{ steps.derived-data.outputs.cache-primary-key }}
