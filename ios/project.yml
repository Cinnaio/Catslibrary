# XcodeGen 工程描述文件：纯文本描述 Xcode 工程，CI 上用 `xcodegen generate` 生成 .xcodeproj
# 语法参考：https://github.com/yonaskolb/XcodeGen
name: ZhiZhou

options:
  bundleIdPrefix: com.zhizhou
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  ZhiZhouCore:
    path: ZhiZhouCore

settings:
  base:
    LIBRARY_WIDGET_APP_GROUP: group.com.zhizhou.app

targets:
  ZhiZhou:
    type: application
    platform: iOS
    dependencies:
      - package: ZhiZhouCore
      - target: ZhiZhouWidgets
        embed: true
    sources:
      - path: WidgetShared
      - path: ZhiZhou
        excludes:
          - "Support/Info.plist"
          - "Support/PrivacyInfo.xcprivacy"
          - "Resources/ReaderEdgeRuntime.js"
      - path: ZhiZhou/Support/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ZhiZhou/Resources/ReaderEdgeRuntime.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhizhou.app
        MARKETING_VERSION: "1.6.0"
        CURRENT_PROJECT_VERSION: 39
        INFOPLIST_FILE: ZhiZhou/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: ZhiZhou/Support/ZhiZhou.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES

  ZhiZhouWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ZhiZhouWidgets
        excludes:
          - "Info.plist"
          - "ZhiZhouWidgets.entitlements"
      - path: WidgetShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhizhou.app.widgets
        PRODUCT_NAME: ZhiZhouWidgets
        MARKETING_VERSION: "1.6.0"
        CURRENT_PROJECT_VERSION: 39
        INFOPLIST_FILE: ZhiZhouWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: ZhiZhouWidgets/ZhiZhouWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"

  ZhiZhouTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZhiZhouTests
    dependencies:
      - target: ZhiZhou
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  ZhiZhouUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ZhiZhouUITests
    dependencies:
      - target: ZhiZhou
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: ZhiZhou

schemes:
  ZhiZhou:
    build:
      targets:
        ZhiZhou: all
    run:
      config: Debug
    archive:
      config: Release

  ZhiZhouReaderTests:
    build:
      targets:
        ZhiZhou: all
        ZhiZhouTests: [test]
    test:
      config: Debug
      targets:
        - ZhiZhouTests

  ZhiZhouAudit:
    build:
      targets:
        ZhiZhou: all
        ZhiZhouUITests: [test]
    test:
      config: Debug
      targets:
        - ZhiZhouUITests
